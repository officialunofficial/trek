name: cargo-deny

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/cargo-deny.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/cargo-deny.yml"
  schedule:
    # Catches a newly-published advisory against an unchanged dependency
    # tree. Runs weekly, not daily — advisories do not appear that often.
    - cron: "0 6 * * 1"

jobs:
  cargo-deny:
    name: advisories, licenses, bans, sources
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - licenses
          - bans
          - sources
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: cargo-deny check ${{ matrix.checks }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
